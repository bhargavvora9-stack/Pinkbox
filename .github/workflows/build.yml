name: Pinkbox build verification

on:
  push:
    branches: [main, pinkbox-zip-design-rebuild]
  pull_request:
    branches: [main, pinkbox-zip-design-rebuild]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit regenerated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync patched dependency lockfile"
            git push
          fi

      - name: Build
        run: npm run build
