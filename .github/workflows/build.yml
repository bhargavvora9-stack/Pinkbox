name: Pinkbox build verification

on:
  push:
    branches: [main, pinkbox-zip-design-rebuild]
  pull_request:
    branches: [main, pinkbox-zip-design-rebuild]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply compatible security fixes
        run: npm audit fix --no-fund

      - name: Report dependency security audit
        run: |
          npm audit --json > /tmp/pinkbox-npm-audit.json || true
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("/tmp/pinkbox-npm-audit.json", "utf8"));
            const counts = report.metadata?.vulnerabilities;
            if (!counts) {
              console.log("npm audit did not return a vulnerability summary.");
              process.exit(0);
            }
            console.log("Dependency audit:", JSON.stringify(counts));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(
                name + " | " + item.severity +
                " | direct=" + item.isDirect +
                " | range=" + item.range +
                " | fix=" + JSON.stringify(item.fixAvailable)
              );
            }
          '

      - name: Commit security-patched dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply compatible npm security fixes"
            git push
          fi

      - name: Build
        run: npm run build
